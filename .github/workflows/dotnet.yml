# This workflow builds and tests the .NET solution and validates its structure.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate solution and project files
      shell: bash
      run: |
        set -euo pipefail

        solution="RaceDayAPI.sln"
        if [[ ! -f "$solution" ]]; then
          echo "Required solution file not found: $solution" >&2
          exit 1
        fi

        mapfile -t projects < <(
          sed -nE 's/^[[:space:]]*Project\(\"\\{[^}]+\\}\"\\)[[:space:]]*=[[:space:]]*"[^"]+",[[:space:]]*"([^"]+\.(csproj|dcproj))".*/\1/p' "$solution" \
            | tr '\\' '/'
        )

        if [[ ${#projects[@]} -eq 0 ]]; then
          echo "No .csproj or .dcproj project references found in $solution" >&2
          exit 1
        fi

        missing=0
        for project in "${projects[@]}"; do
          if [[ ! -f "$project" ]]; then
            echo "Project referenced by $solution is missing: $project" >&2
            missing=1
          fi
        done

        if [[ "$missing" -ne 0 ]]; then
          exit 1
        fi

        echo "Repository structure is valid: all solution project files are present."

  build:
    needs: validate-structure
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal
   
