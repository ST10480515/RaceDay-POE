name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-structure:
    name: Validate solution structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate solution and project files
        shell: bash
        run: |
          set -euo pipefail

          solution="$(find . -maxdepth 3 -name '*.sln' -print -quit)"
          if [[ -z "$solution" ]]; then
            echo "No .sln file found in the repository." >&2
            exit 1
          fi

          solution="${solution#./}"

          if [[ ! -f "$solution" ]]; then
            echo "Required solution file not found: $solution" >&2
            exit 1
          fi

          mapfile -t projects < <(
            sed -nE 's/^[[:space:]]*Project\(\"\\{[^}]+\\}\"\)[[:space:]]*=[[:space:]]*"[^"]+",[[:space:]]*"([^"]+\.(csproj|dcproj))".*/\1/p' "$solution" \
              | tr '\\' '/'
          )

          if [[ ${#projects[@]} -eq 0 ]]; then
            echo "No .csproj or .dcproj project references found in $solution" >&2
            exit 1
          fi

          missing=0
          for project in "${projects[@]}"; do
            if [[ ! -f "$project" ]]; then
              echo "Project referenced by $solution is missing: $project" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          echo "Repository structure is valid: all solution project files are present."

  build:
    name: Build and test
    needs: validate-structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/*.props
            **/*.targets

      - name: Find solution
        shell: bash
        run: |
          set -euo pipefail
          solution="$(find . -maxdepth 3 -name '*.sln' -print -quit)"
          if [[ -z "$solution" ]]; then
            echo "No .sln file found in the repository." >&2
            exit 1
          fi
          echo "SOLUTION_FILE=${solution#./}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore "${SOLUTION_FILE}"

      - name: Build
        run: dotnet build "${SOLUTION_FILE}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${SOLUTION_FILE}" --configuration Release --no-build --verbosity normal
